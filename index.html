<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>artinspo — Inspiration for Artists</title>
  <meta name="description" content="Enter your email and get a unique image for creative inspiration. Free, instant, beautiful.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="container">
    <div class="brand">
      <h1 class="logo"><span class="logo-art">art</span>inspo<span>.</span></h1>
      <p class="tagline">Creative inspiration, straight to your inbox.</p>
    </div>

    <form class="form" id="artinspo-form">
      <input
        type="email"
        name="email"
        placeholder="Enter your email"
        required
        autocomplete="email"
        class="input"
      />
      <button type="submit" class="btn">Send me inspiration</button>
    </form>

    <div class="message" id="message"></div>

    <p class="fine-print">Free. No spam. Just one unique image to spark your creativity.</p>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
